    <script>
        const COOKIE_PREMIUM = "uf_premium";
        const COOKIE_KEY = "uf_key";

        // IMPORTANT : change ce secret (long & random).
        // Il sert à générer/valider une clé sans serveur.
        const ADMIN_SECRET = "UF-869A-618F-B4C4";

        function setStatus(msg) { document.getElementById("status").textContent = msg; }
        function copyText(t) { navigator.clipboard.writeText(t).catch(() => { }); }

        function setCookie(name, value, days = 365) {
            const expires = new Date(Date.now() + days * 864e5).toUTCString();
            document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; Expires=${expires}; Path=/; SameSite=Lax`;
        }
        function deleteCookie(name) {
            document.cookie = `${encodeURIComponent(name)}=; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/; SameSite=Lax`;
        }

        // SHA-256 helper
        async function sha256(str) {
            const enc = new TextEncoder().encode(str);
            const buf = await crypto.subtle.digest("SHA-256", enc);
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
        }

        function prettyKey(hex) {
            // UF-xxxx-xxxx-xxxx (12 hex chars)
            const s = hex.slice(0, 12).toUpperCase();
            return `UF-${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8, 12)}`;
        }

        async function makeKey(email) {
            const h = await sha256((email.trim().toLowerCase()) + "|" + ADMIN_SECRET);
            return prettyKey(h);
        }

        document.getElementById("activate").addEventListener("click", async () => {
            const email = document.getElementById("email").value || "";
            const key = (document.getElementById("key").value || "").trim().toUpperCase();
            if (!email || !key) return setStatus("❌ Email et clé requis.");

            const expected = await makeKey(email);
            if (key === expected) {
                setCookie(COOKIE_PREMIUM, "1", 365);
                setCookie(COOKIE_KEY, key, 365);
                setStatus("✅ Premium activé. Tu peux retourner sur la page des outils.");
            } else {
                setStatus("❌ Clé invalide.");
            }
        });

        document.getElementById("deactivate").addEventListener("click", () => {
            deleteCookie(COOKIE_PREMIUM);
            deleteCookie(COOKIE_KEY);
            setStatus("Premium désactivé sur ce navigateur.");
        });

        // Générateur de clé (pour toi / admin)
        document.getElementById("gen").addEventListener("click", async () => {
            const email = document.getElementById("gen_email").value || "";
            if (!email) return;
            document.getElementById("gen_out").value = await makeKey(email);
        });

        document.getElementById("gen_copy").addEventListener("click", () => {
            copyText(document.getElementById("gen_out").value || "");
        });

        document.getElementById("y").textContent = String(new Date().getFullYear());
    </script>
